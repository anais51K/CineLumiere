<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../ressources/connexion.css" />
</head>
<body>
<div class="container">
    <h1>Connexion</h1>

    <form>
        <div class="form-group">
            <label class="form-label" for="email">Adresse e-mail</label>
            <input type="email" id="email" class="form-control" placeholder="vous@exemple.com" />
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Mot de passe</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" />
            <div class="forgot-link"><a href="#">Mot de passe oublié ?</a></div>
        </div>

        <button type="submit" class="btn-primary">Se connecter</button>
    </form>

    <div class="divider"><span>ou</span></div>

    <div class="box-register">
        Pas encore de compte ? <a href="formulaire_inscription.html">Créer un compte</a>
    </div>
</div>
</body>
</html>
